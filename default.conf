server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Headers de seguranca e SEO
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache para assets estaticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|bin)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # llms.txt
    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
        expires -1;
    }

    # robots.txt
    location = /robots.txt {
        default_type "text/plain";
        expires 1d;
    }

    # sitemap.xml
    location = /sitemap.xml {
        default_type "application/xml; charset=utf-8";
        expires 1d;
    }

    # Rotas estaticas com suporte a subdiretorios
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /index.html;
}
