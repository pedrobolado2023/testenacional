worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Charset padrão para português
    charset utf-8;

    # Logs
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Compressão Gzip para performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Headers de segurança e SEO
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Cache para assets estáticos
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }

        # Sem cache para HTML (importante para SEO/LLMs lerem sempre o mais recente)
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # llms.txt — Content-type correto para leitores de IA
        location = /llms.txt {
            add_header Content-Type "text/plain; charset=utf-8";
            expires -1;
        }

        # robots.txt
        location = /robots.txt {
            add_header Content-Type "text/plain";
            expires 1d;
        }

        # sitemap.xml
        location = /sitemap.xml {
            add_header Content-Type "application/xml; charset=utf-8";
            expires 1d;
        }

        # Roteamento de subdiretórios — tenta arquivo, depois diretório com index.html
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        # Página 404 customizada
        error_page 404 /index.html;
        location = /404.html {
            internal;
        }
    }
}
